name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # Unit tests for every module, plus both flavors (ADR-012). Building a play variant also runs the
      # check that its manifest has no SMS permission. Device tests need an emulator and, for the real
      # model, a pushed model file, so they run locally (see CLAUDE.md); here they are only compiled.
      - run: ./gradlew test assemblePersonalDebug assemblePlayDebug :brain:litertlm:assembleDebugAndroidTest :connector:messages:assembleDebugAndroidTest
